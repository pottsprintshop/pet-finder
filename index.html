<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found a Pet?</title>
<style>
  @font-face {
    font-family: "LemonMilk";
    src: url("fonts/LEMONMILK-Bold.otf") format("opentype");
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: "LemonMilk";
    src: url("fonts/LEMONMILK-Medium.otf") format("opentype");
    font-weight: 500;
    font-display: swap;
  }
  :root {
    --bg-top: #0d2961;
    --bg-bottom: #124285;
    --card: rgba(255, 255, 255, 0.10);
    --card-border: rgba(255, 255, 255, 0.18);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.65);
    --accent: #8cd1ff;
    --win: #ffd459;
    --success: #4dc773;
    --grid-minor: rgba(255, 255, 255, 0.07);
    --grid-major: rgba(255, 255, 255, 0.15);
    --grid-spacing: 26px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    background-color: var(--bg-bottom);
    background-image:
      repeating-linear-gradient(to right, var(--grid-major) 0 1px, transparent 1px calc(var(--grid-spacing) * 4)),
      repeating-linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px calc(var(--grid-spacing) * 4)),
      repeating-linear-gradient(to right, var(--grid-minor) 0 1px, transparent 1px var(--grid-spacing)),
      repeating-linear-gradient(to bottom, var(--grid-minor) 0 1px, transparent 1px var(--grid-spacing)),
      linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
  }
  #app {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    height: fit-content;
    backdrop-filter: blur(6px);
  }
  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    margin-top: 1.5rem;
    overflow: hidden;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px dashed var(--card-border);
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 1rem;
  }
  h1 {
    font-family: "LemonMilk", -apple-system, sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
    margin: 0 0 0.5rem;
    color: var(--win);
  }
  p { color: var(--text-dim); }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  a.button {
    display: block;
    padding: 0.9rem;
    border-radius: 10px;
    text-decoration: none;
    font-family: "LemonMilk", -apple-system, sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
  }
  a.call { background: var(--success); color: #06331a; }
  a.text { background: var(--accent); color: #04283f; }
</style>
</head>
<body>
<div id="app">Reading tag...</div>

<script>
  const app = document.getElementById("app");
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get("d");

  function showMessage(text) {
    app.textContent = text;
  }

  function decodePayload(encoded) {
    let b64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  function showResult(data) {
    app.innerHTML = "";

    const photoBox = document.createElement("div");
    photoBox.className = "photo";

    function showPhotoPlaceholder() {
      photoBox.className = "photo placeholder";
      photoBox.textContent = data.pet + " hasn't uploaded a photo yet.";
    }

    if (data.photo) {
      const img = document.createElement("img");
      img.src = data.photo;
      img.alt = data.pet;
      img.onerror = showPhotoPlaceholder;
      photoBox.appendChild(img);
    } else {
      showPhotoPlaceholder();
    }

    const heading = document.createElement("h1");
    heading.textContent = "You found " + data.pet + "!";
    app.appendChild(heading);

    const para = document.createElement("p");
    para.textContent = "Please contact " + data.owner + ":";
    app.appendChild(para);

    const buttons = document.createElement("div");
    buttons.className = "buttons";

    const callLink = document.createElement("a");
    callLink.className = "button call";
    callLink.href = "tel:" + data.phone;
    callLink.textContent = "Call " + data.owner;
    buttons.appendChild(callLink);

    const messageBody = "Hey " + data.owner + ", I found " + data.pet +
      ". I would love to get you both reunited, please give me a call as soon as you can!";

    const textLink = document.createElement("a");
    textLink.className = "button text";
    textLink.href = "sms:" + data.phone + "&body=" + encodeURIComponent(messageBody);
    textLink.textContent = "Text " + data.owner;
    buttons.appendChild(textLink);

    app.appendChild(buttons);
    app.appendChild(photoBox);
  }

  if (!encoded) {
    showMessage("No pet tag data was provided.");
  } else {
    try {
      showResult(decodePayload(encoded));
    } catch (e) {
      showMessage("This tag isn't recognized.");
    }
  }
</script>
</body>
</html>
