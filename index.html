<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found a Pet?</title>
<style>
  :root {
    --bg-top: #0a1628;
    --bg-bottom: #050d1a;
    --grid-minor: rgba(255,255,255,0.05);
    --grid-major: rgba(255,255,255,0.12);
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(93,217,245,0.28);
    --text: #eaf2fb;
    --text-dim: #93a4bd;
    --accent: #5dd9f5;
    --win: #f0c419;
    --success: #35d07f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    background-color: var(--bg-bottom);
    background-image:
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom)),
      repeating-linear-gradient(0deg, var(--grid-major) 0 1px, transparent 1px 88px),
      repeating-linear-gradient(90deg, var(--grid-major) 0 1px, transparent 1px 88px),
      repeating-linear-gradient(0deg, var(--grid-minor) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, var(--grid-minor) 0 1px, transparent 1px 22px);
  }
  #app {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    height: fit-content;
    backdrop-filter: blur(6px);
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
    color: var(--win);
  }
  p { color: var(--text-dim); }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  a.button {
    display: block;
    padding: 0.9rem;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
  }
  a.call { background: var(--success); color: #05170d; }
  a.text { background: var(--accent); color: #04222b; }
</style>
</head>
<body>
<div id="app">Looking up tag info...</div>

<script>
  // Replace this with your deployed Apps Script /exec URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZxhanK9gLIZx7Ybg-V2zcm-0VjB7ROAujeEcoi4HkLXGNjQGcKXW-31XGblM0QRb-xw/exec";

  const app = document.getElementById("app");
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  function showMessage(text) {
    app.textContent = text;
  }

  function showResult(data) {
    app.innerHTML = "";

    const heading = document.createElement("h1");
    heading.textContent = "You found " + data.petName + "!";
    app.appendChild(heading);

    const para = document.createElement("p");
    para.textContent = "Please contact " + data.ownerName + ":";
    app.appendChild(para);

    const buttons = document.createElement("div");
    buttons.className = "buttons";

    const callLink = document.createElement("a");
    callLink.className = "button call";
    callLink.href = "tel:" + data.ownerPhone;
    callLink.textContent = "Call " + data.ownerName;
    buttons.appendChild(callLink);

    const messageBody = "Hey " + data.ownerName + ", I found " + data.petName +
      ". I would love to get you both reunited, please give me a call as soon as you can!";

    const textLink = document.createElement("a");
    textLink.className = "button text";
    textLink.href = "sms:" + data.ownerPhone + "&body=" + encodeURIComponent(messageBody);
    textLink.textContent = "Text " + data.ownerName;
    buttons.appendChild(textLink);

    app.appendChild(buttons);
  }

  if (!id) {
    showMessage("No pet tag ID was provided.");
  } else if (APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
    showMessage("Setup incomplete: Apps Script URL not configured.");
  } else {
    fetch(APPS_SCRIPT_URL + "?id=" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          showMessage("This tag isn't recognized.");
        } else {
          showResult(data);
        }
      })
      .catch(function () {
        showMessage("Couldn't load tag info. Check your connection and try again.");
      });
  }
</script>
</body>
</html>
